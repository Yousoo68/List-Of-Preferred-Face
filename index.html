<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>신유수의 취향 외모 리스트</title>
<style>
  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    min-height: 100vh;
    box-sizing: border-box;
    background: linear-gradient(135deg, #feda75 0%, #fa7e1e 25%, #d62976 55%, #962fbf 80%, #4f5bd5 100%);
    background-attachment: fixed;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    padding: 36px 40px;
    border-radius: 16px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid rgba(0, 0, 0, 0.1);
    color: #222;
  }
  .list {
    font-size: 16px;
    line-height: 2;
    color: #333;
    text-align: center;
  }
  .list b {
    font-weight: 700;
    color: #111;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>신유수의 취향 외모 리스트</h1>
    <div class="list">
      <b>지현</b> 🌟<br>
      예진<br>
      만둥글<br>
      <b>은짱</b><br>
      이루리<br>
      <b>다인이공</b><br>
      려진<br>
      <b>혜임</b><br>
      시은<br>
      <b>조뽀또</b><br>
      채원<br>
      강하라<br>
      <b>윤선아</b> ⭐️<br>
      지아<br>
      주현이관찰일기<br>
      <b>찐따 라이프 (효빈이)</b> ⭐️
    </div>
  </div>
</body>
</html>
